<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0e14">
  <title>MultiCámara Web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar"><span class="brand">◉ MULTICÁMARA</span><button id="flashBtn" class="icon-btn" disabled>⚡ Flash</button></header>
  <section class="viewer">
  <video id="preview" autoplay muted playsinline></video>
  <canvas id="output_canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"></canvas>
  <div id="empty" class="empty">...</div>
</section>
    <section class="controls">
      <div class="row"><label for="cameraSelect">Cámara / lente disponible</label><select id="cameraSelect" aria-label="Seleccionar cámara"></select></div>
      <div class="row zoom-row"><label for="zoom">Zoom <output id="zoomValue">1×</output></label><input type="range" id="zoom" min="1" max="1" step="0.1" value="1" disabled></div>
      <div class="mode-row"><button id="photoMode" class="mode active">FOTO</button><button id="videoMode" class="mode">VIDEO</button></div>
      <div class="shutter-row"><button id="flipBtn" class="round secondary" title="Cambiar frontal/trasera" aria-label="Cambiar frontal o trasera">⇄</button><button id="captureBtn" class="shutter" disabled aria-label="Tomar fotografía"></button><button id="stopBtn" class="round secondary" disabled title="Detener grabación" aria-label="Detener grabación">■</button></div>
      <p class="hint">Las cámaras y el flash dependen de tu dispositivo y navegador.</p>
      <a id="downloadLink" hidden>Descargar archivo</a>
    </section>
  </main>
<script type="module" src="app.js"></script>
</body>
</html>
